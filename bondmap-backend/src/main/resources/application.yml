server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: bondmap-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bondmap}}
    username: ${DATABASE_USERNAME:${DB_USER:bondmap}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:bondmap_password}}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.example.bondmap_backend: INFO
    org.flywaydb: INFO
